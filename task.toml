schema_version = "1.4"
artifacts = ["/app/boundarygate/authorizer.py"]

[task]
name = "independent/boundarygate-security-lab"
version = "1.0.0"
description = "Repair a delegated agent-tool authorization gate across signed lineage, policy intersection, canonical resources, atomic budgets, retries, and revocation."
keywords = ["cybersecurity", "iam", "agent-security", "authorization", "red-team", "runtime-repair"]

[metadata]
category = "security"
subcategory = "iam-and-agent-tool-security"
difficulty = "hard"
tags = ["python", "hmac", "delegation", "prompt-injection", "authorization", "transactions", "revocation"]
task_objective = ["debug", "implement", "secure"]
artifact_type = ["codebase", "evaluation-environment"]
expert_time_estimate_hours = 8
difficulty_explanation = "The repair must keep legitimate tools usable while composing independently signed delegations, ancestor denies, exact-byte lineage, canonical paths, shared budgets, atomic multi-operation commits, retry identity, and live revocation. A locally plausible repair can grant excess authority or poison later decisions. The configured time budget is not evidence of difficulty."
solution_explanation = "The reference validates strict envelopes and complete chains, normalizes resources before intersecting rules, rechecks current authority before retry lookup, and stages all budget, identity, and ledger updates until a fresh batch can commit. Control serials advance only after complete authentication."
verification_explanation = "A separate offline verifier supplies independently signed messages to fresh candidate subprocesses. It compares full verdict transcripts for allowed and denied operations, probes state through later requests, checks exact boundaries, and combines delegation, retries, failed transactions, budgets, tenant separation, injected context, and revocation in seeded traces."
independent_redesign = true

[agent]
timeout_sec = 72000.0

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
user = "root"

[verifier.environment]
os = "linux"
network_mode = "no-network"
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0

[environment]
os = "linux"
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0
